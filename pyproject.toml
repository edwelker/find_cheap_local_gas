[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gas_scraper"
version = "0.1.0"
description = "Gas Price Scraper from GasBuddy"
authors = [
    { name = "E Welker" }
]
dependencies = [
    "pandas>=2.2.0",
    "selenium>=4.16.0",
    "beautifulsoup4>=4.12.0",
    "uszipcode>=1.0.1",
    "sqlalchemy-mate<1.5.0",
    "python-Levenshtein",
    "tzdata",
    "geopy",
    "click>=8.1.0",
    "selenium-stealth>=1.0.6",
]
requires-python = ">=3.9"

[project.scripts]
gas-scrape = "gas_scraper.main:main"
gas-cleanup = "gas_scraper.cleanup_history:cleanup"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
