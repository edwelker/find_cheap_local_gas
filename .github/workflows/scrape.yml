name: Daily Gas Scrape

on:
  schedule:
    - cron: '30 7,19 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: America/New_York

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper (Maryland)
        run: python gas.py 1

      - name: Run Scraper (Long Island)
        run: python gas.py 2

      - name: Run Scraper (Western Mass)
        run: python gas.py 3

      - name: Cleanup Old History
        run: python cleanup_history.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ latest_*.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated gas price update: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
